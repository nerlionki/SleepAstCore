name: Deploy resource release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      context:
        description: Network data context
        type: choice
        options: [prod, test]
        default: test
      protocols:
        description: Resource protocols to deploy
        type: choice
        options: [v2, both]
        default: v2
      test_version:
        description: Numeric immutable version for test resources
        default: '1.0.0'
      release_tag:
        description: Published stable tag for prod, or branch/ref for test
        required: true
        default: v1.0.0
permissions:
  contents: read
concurrency:
  group: resources-${{ inputs.context || 'prod' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_CONTEXT: ${{ inputs.context || 'prod' }}
      DEPLOY_RESOURCE_V1: ${{ github.event_name == 'workflow_dispatch' && inputs.protocols == 'both' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      RESOURCE_VERSION: ${{ inputs.context == 'test' && inputs.test_version || inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Validate published stable release
        if: env.RESOURCE_CONTEXT == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read current image baseline
        run: |
          set -euo pipefail
          apis=(2)
          if [ "$DEPLOY_RESOURCE_V1" = true ]; then apis=(1 2); fi
          for api in "${apis[@]}"; do
            baseline="$RUNNER_TEMP/resource-image-baseline-v$api.json"
            status=$(curl --silent --show-error --location --retry 2 --max-time 30 --output "$baseline" --write-out '%{http_code}' "https://pokepokeshock.cn/$RESOURCE_CONTEXT/resources/v$api/manifest.json")
            if [ "$status" = 200 ]; then
              if [ "$api" = 1 ]; then
                echo "RESOURCE_BASE_MANIFEST=$baseline" >> "$GITHUB_ENV"
              else
                echo "RESOURCE_V2_BASE_MANIFEST=$baseline" >> "$GITHUB_ENV"
              fi
            elif [ "$status" != 404 ]; then
              echo "Cannot read v$api image baseline: HTTP $status" >&2
              exit 1
            fi
          done
      - name: Build and verify release
        run: |
          if [ "$DEPLOY_RESOURCE_V1" = true ]; then
            npm run build
            npm run verify
          fi
          RESOURCE_BASE_MANIFEST="${RESOURCE_V2_BASE_MANIFEST:-}" npm run build:v2
          npm run verify:v2
      - uses: actions/upload-artifact@v4
        with:
          name: sleepast-core-resources
          path: dist/
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Upload and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          version="${RESOURCE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          [[ "$RESOURCE_CONTEXT" == prod || "$RESOURCE_CONTEXT" == test ]]
          ssh -p "$port" "$remote" "mkdir -p /var/www/sleepast-core/$RESOURCE_CONTEXT/incoming/$version"
          scp -P "$port" -r dist/"$RESOURCE_CONTEXT"/resources "$remote:/var/www/sleepast-core/$RESOURCE_CONTEXT/incoming/$version/"
          if [ "$DEPLOY_RESOURCE_V1" = true ]; then
            ssh -p "$port" "$remote" "bash -s -- '$version' '$RESOURCE_CONTEXT'" < deploy/activate-context.sh
          fi
          ssh -p "$port" "$remote" "bash -s -- '$version' '$RESOURCE_CONTEXT'" < deploy/activate-context-v2.sh
