# Install in /etc/nginx/sites-available/sleepast-core, then enable and run nginx -t.
# Obtain a certificate with certbot --nginx -d pokepokeshock.cn after DNS is ready.
server {
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    listen 80;
    server_name pokepokeshock.cn;
    root /var/www/sleepast-core;
    location ~ ^/(prod|test)/resources/v1/manifest\.json$ {
        alias /var/www/sleepast-core/$1/current/resources/v1/manifest.json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(prod|test)/resources/v1/releases/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Older clients keep their original endpoint during migration.
    location = /resources/v1/manifest.json {
        alias /var/www/sleepast-core/current/resources/v1/manifest.json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /resources/v1/releases/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location / { return 404; }
}
